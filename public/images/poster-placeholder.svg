<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">Poster Placeholder</title>
  <desc id="desc">Placeholder poster for movie and series cards</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b7a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <circle cx="320" cy="90" r="120" fill="#ffffff" opacity="0.04"/>
  <circle cx="80" cy="540" r="140" fill="#ffffff" opacity="0.03"/>
  <rect x="80" y="120" width="240" height="340" rx="22" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
  <rect x="140" y="210" width="120" height="120" rx="60" fill="url(#accent)" opacity="0.92"/>
  <polygon points="184,245 184,295 228,270" fill="#ffffff"/>
  <text x="200" y="390" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">StreamView</text>
  <text x="200" y="422" fill="#c7c9d6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">Movie & Series Poster</text>
</svg>
